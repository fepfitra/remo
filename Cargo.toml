[package]
name = "remo2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.7"
axum-extra = { version = "0.12.2", features = ["cookie"] }
axum-test = "18.4.1"
chrono = { version = "0.4.42", features = ["serde"] }
reqwest = "0.12.26"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
time = "0.3.44"
tokio = { version = "1.48.0", features = ["full", "macros", "rt-multi-thread"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
